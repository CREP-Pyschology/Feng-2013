					if(trialstoask.includes(trialnum)){

						}

				choices: ['y', 'n'],
				trial_duration: function() {
					if(trialstoask.includes(trialnum)){

					}else {
						return 10
						}
					},
				on_finish: function(){trialnum++}	
			}
		
			
		],
		timeline_variables: passage
	}

		timeline.push(test_procedure);
	
   }
